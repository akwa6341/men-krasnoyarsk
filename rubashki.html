<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рубашки — Мужская одежда Красноярск</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a1628;
            color: #ffffff;
            padding: 20px;
        }
        .back-btn {
            display: inline-block;
            background: #ffd700;
            color: #0a1628;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 20px;
        }
        h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
        }
        .products {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .product-card {
            background: linear-gradient(145deg, #132d5e, #0d2248);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .product-card img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffd700;
            margin: 10px 0;
        }
        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Назад в каталог</a>
    
    <h1>👔 Рубашки</h1>
    
    <div class="products">
        <!-- Товар 1 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x400/132d5e/ffd700?text=Рубашка+1" alt="Рубашка 1">
            <div class="product-name">Рубашка классическая белая</div>
            <div class="product-price">2 500 ₽</div>
        </div>
        
        <!-- Товар 2 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/300x400/132d5e/ffd700?text=Рубашка+2" alt="Рубашка 2">
            <div class="product-name">Рубашка в клетку</div>
            <div class="product-price">2 800 ₽</div>
        </div>
        
        <!-- Добавьте ещё товары по аналогии -->
    </div>
</body>
</html>
